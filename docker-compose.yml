services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./instance:/app/backend/instance
      - ./reports:/app/backend/reports

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_API_BASE_URL: http://127.0.0.1:5000
    ports:
      - "3000:80"
    depends_on:
      - backend
